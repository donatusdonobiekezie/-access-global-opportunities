<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>ACCESS — Account</title><style>
body{margin:0;background:#090b0d;color:#f5f7f8;font:16px system-ui;padding:24px}main{max-width:460px;margin:10vh auto;background:#121619;border:1px solid #293136;border-radius:22px;padding:28px}h1{font-size:30px}p{color:#aeb7bc;line-height:1.5}input,button{width:100%;box-sizing:border-box;padding:14px;margin:8px 0;border-radius:11px;font-size:16px}input{background:#0d1113;color:white;border:1px solid #384147}button{background:#e9fff6;color:#07120e;border:0;font-weight:800}.tabs{display:flex;gap:8px}.tabs button{background:#171c20;color:white;border:1px solid #384147}.tabs .active{background:#e9fff6;color:#07120e}#status{min-height:24px;color:#aeb7bc}</style></head><body><main>
<strong>ACCESS</strong><p>Your Personal Opportunity Radar</p><div class="tabs"><button id="s" class="active">Create account</button><button id="l">Sign in</button></div>
<h1 id="title">Create your account</h1><form id="f"><div id="nw"><input id="name" placeholder="Full name" autocomplete="name"></div><input id="email" type="email" placeholder="Email" required autocomplete="email"><input id="pw" type="password" placeholder="Password (8+ characters)" minlength="8" required autocomplete="new-password"><button id="go">Create account</button></form><div id="status"></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="access-config.js"></script><script>
const c=window.ACCESS_CONFIG,client=(c.SUPABASE_URL&&c.SUPABASE_PUBLISHABLE_KEY&&!c.SUPABASE_PUBLISHABLE_KEY.includes("PASTE_"))?supabase.createClient(c.SUPABASE_URL,c.SUPABASE_PUBLISHABLE_KEY):null;
let mode="signup";const $=id=>document.getElementById(id);function setMode(m){mode=m;$("s").classList.toggle("active",m==="signup");$("l").classList.toggle("active",m==="login");$("nw").style.display=m==="signup"?"block":"none";$("title").textContent=m==="signup"?"Create your account":"Welcome back";$("go").textContent=m==="signup"?"Create account":"Sign in";$("status").textContent=""}
$("s").onclick=()=>setMode("signup");$("l").onclick=()=>setMode("login");
$("f").onsubmit=async e=>{e.preventDefault();if(!client)return $("status").textContent="Add your Supabase Publishable key to access-config.js first."; $("status").textContent="Working...";try{let email=$("email").value.trim(),pw=$("pw").value;if(mode==="signup"){let r=await client.auth.signUp({email,password:pw,options:{data:{full_name:$("name").value.trim()}}});if(r.error)throw r.error;if(r.data.session)location.href="dashboard.html";else{setMode("login");$("status").textContent="Account created. Check your email if confirmation is required, then sign in."}}else{let r=await client.auth.signInWithPassword({email,password:pw});if(r.error)throw r.error;location.href="dashboard.html"}}catch(x){$("status").textContent=x.message||"Something went wrong."}};
</script></body></html>
