<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>ACCESS — Dashboard</title><style>
body{margin:0;background:#090b0d;color:#f5f7f8;font:16px system-ui}header{padding:18px 20px;border-bottom:1px solid #293136;display:flex;justify-content:space-between}.out{background:#121619;color:white;border:1px solid #384147;border-radius:9px;padding:9px}main{max-width:1050px;margin:auto;padding:28px 20px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:#111619;border:1px solid #293136;border-radius:16px;padding:18px}.card b{font-size:25px;display:block}.muted{color:#aeb7bc}.badge{color:#a5f1cf}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}}</style></head><body><header><b>ACCESS</b><button class="out" id="out">Sign out</button></header><main><p class="muted">YOUR PERSONAL OPPORTUNITY RADAR</p><h1 id="welcome">Your dashboard</h1><p class="muted" id="email"></p><div class="grid"><div class="card"><b id="matches">0</b><span class="muted">Verified opportunities</span></div><div class="card"><b id="saved">0</b><span class="muted">Saved</span></div><div class="card"><b id="apps">0</b><span class="muted">Applications</span></div><div class="card"><b class="badge" id="plan">FREE</b><span class="muted">Current plan</span></div></div><section class="card" style="margin-top:16px"><h2>Opportunity feed</h2><p class="muted">Verified opportunities will appear here as the ACCESS discovery pipeline is connected.</p></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="access-config.js"></script><script>
(async()=>{const c=window.ACCESS_CONFIG;if(!c.SUPABASE_URL||!c.SUPABASE_PUBLISHABLE_KEY||c.SUPABASE_PUBLISHABLE_KEY.includes("PASTE_"))return;const client=supabase.createClient(c.SUPABASE_URL,c.SUPABASE_PUBLISHABLE_KEY),g=await client.auth.getSession(),s=g.data.session;if(!s)return location.href="auth.html";$("email").textContent=s.user.email||"";const n=s.user.user_metadata?.full_name;if(n)$("welcome").textContent="Welcome, "+n;let q=await client.from("subscriptions").select("plan,status").eq("user_id",s.user.id).maybeSingle();if(q.data)$("plan").textContent=(q.data.plan+" "+q.data.status).toUpperCase();let a=await client.from("saved_opportunities").select("*",{count:"exact",head:true}).eq("user_id",s.user.id),b=await client.from("applications").select("*",{count:"exact",head:true}).eq("user_id",s.user.id),m=await client.from("opportunities").select("*",{count:"exact",head:true}).eq("verification_status","verified");$("saved").textContent=a.count||0;$("apps").textContent=b.count||0;$("matches").textContent=m.count||0;$("out").onclick=async()=>{await client.auth.signOut();location.href="auth.html"}})();const $=id=>document.getElementById(id);
</script></body></html>
